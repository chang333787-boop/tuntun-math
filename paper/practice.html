<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>맞춤 연습지</title>
<style>
/* 맞춤 연습지 — 선생님이 한 아이에게 고른 칸만 연습(인쇄용 A4) · 갈래마다 한 쪽(문제가 10개를 넘으면 이어서 다음 쪽) · 보기 하나(풀이 채움) · 끝에 정답(넘치면 다음 쪽) · 학년 표시 X */
@page{size:A4;margin:0}
*{box-sizing:border-box}
body{margin:0;background:#e9e4dc;color:#1f1b16;font:12pt/1.5 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact;word-break:keep-all}
.page{width:210mm;height:297mm;margin:8mm auto;background:#fff;padding:14mm 15mm 12mm;position:relative;display:flex;flex-direction:column;overflow:hidden;page-break-after:always;break-after:page}
@media print{body{background:#fff}.page{margin:0}.noprint{display:none}}
.band{display:flex;align-items:center;gap:4mm;border-bottom:1.2mm solid var(--c);padding-bottom:3mm;margin-bottom:4mm}
.badge{flex:0 0 auto;width:13mm;height:13mm;border-radius:3mm;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20pt;font-weight:800}
.band h1{margin:0;font-size:21pt;letter-spacing:-.3px;line-height:1.25}
.band .who{margin-left:auto;font-size:11pt;color:#5e554b;white-space:nowrap}
.note{margin:0 0 3mm;font-size:13pt}
.ex{display:flex;align-items:center;gap:4mm;background:var(--t);border-radius:3mm;padding:3mm 4mm;margin-bottom:5mm;font-size:15pt}
.ex b{flex:0 0 auto;color:var(--c);font-size:12pt;border:1.2px solid var(--c);border-radius:99px;padding:.5mm 3mm;background:#fff}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,minmax(0,1fr));gap:4mm 6mm}
.q{border:1.2px solid #d9cdbb;border-radius:3mm;padding:calc(3mm * var(--k,1)) 4mm;display:flex;flex-direction:column;justify-content:center;gap:calc(2mm * var(--k,1));min-width:0;overflow:hidden}
.q{position:relative}.q .n{font-size:11pt;font-weight:800;color:var(--c)}
.ck{position:absolute;top:2.5mm;right:3mm;display:flex;align-items:center;gap:1.2mm;font-size:8.5pt;color:#7a7067}.ck i{width:6mm;height:6mm;border:1.4px solid #8a8076;border-radius:50%}
.cknote{color:var(--c);font-weight:700}
.q .p{font-size:calc(18pt * var(--k,1));line-height:1.5}
.q .p.long{font-size:calc(15pt * var(--k,1))}
.blank-s{display:inline-block;min-width:15mm;height:calc(10mm * var(--k,1));border:1.6px solid #1f1b16;border-radius:1.8mm;background:#fff;vertical-align:middle;margin:0 1.2mm;font-size:0;color:transparent}
.ex .blank-s,.key .blank-s{font-size:14pt;color:#1f1b16;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:0 1.5mm;min-width:10mm;height:8mm}
.ch{display:flex;flex-wrap:wrap;gap:1.5mm 5mm;font-size:calc(16pt * var(--k,1))}
.ch span{white-space:nowrap}
.ch .on{border:1.6px solid var(--c);border-radius:99px;padding:0 2.5mm}
.pic{display:flex;justify-content:center}.pic svg{max-height:calc(20mm * var(--k,1));max-width:100%;height:auto;width:auto}
.pic .dot{fill:#444}.pic .grp{fill:none;stroke:#555;stroke-width:2;stroke-dasharray:4 3}.pic .cell{fill:#fff;stroke:#222;stroke-width:2}.pic .cell.on{fill:#9a9a9a}
/* 문제 속 도형 그림(측정) · 선 · 점선(높이) · 가는 선(직각 표시 · 각 표시) · 글자 — 흑백으로 · 칸이 넘치면 다른 것과 같이 줄어듦(--k) */
.pic .p-ln{fill:none;stroke:#222;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.pic .p-ln.th{stroke-width:1.2}.pic .p-ln.da{stroke:#555;stroke-width:1.6;stroke-dasharray:3 3}.pic .p-t{fill:#111}.pic .p-box{fill:#fff;stroke:#222;stroke-width:2}.pic .p-hand{fill:none;stroke:#111;stroke-width:4;stroke-linecap:round}.pic .p-hand.min{stroke:#555;stroke-width:3}.pic .p-pt{fill:#111}.pic .p-f1{fill:#ddd;stroke:none}.pic .p-f2{fill:#bbb;stroke:none}.pic .ol{stroke:#222;stroke-width:1.5;stroke-linejoin:round}.pic .gh{fill-opacity:.45;stroke:#777;stroke-width:1.5;stroke-dasharray:4 3}.pic .p-arc{fill:none;stroke:#333;stroke-width:2;stroke-linecap:round}.pic .p-edge{fill:none;stroke:#333;stroke-width:3;stroke-linejoin:round}.pic .p-ring{fill:none;stroke:#777;stroke-width:1.5;stroke-dasharray:4 3}.pic .p-ln.mu{stroke:#777}.pic .p-ln.th.mu{stroke:#777;stroke-width:1}.pic .p-t.mu{fill:#555}.pic .p-t.ac{fill:#111;font-weight:800}.pic .p-t.halo{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.pic.fig svg{height:auto;max-height:none;max-width:100%}
/* 도형 그림이 든 칸 — 번호 · 글은 왼쪽, 그림은 오른쪽(칸 높이를 다 씀) · 확인 동그라미가 있으면 그림을 그 아래로 */
.q.qf{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"n f" "t f";column-gap:3mm;align-items:center}
.q.qf .n{grid-area:n;align-self:start}.q.qf .qt{grid-area:t;display:flex;flex-direction:column;gap:calc(2mm * var(--k,1));min-width:0}.q.qf>.pic{grid-area:f}
.q.qf .ck~.pic{align-self:end}
.ex.exf>.pic{margin-left:auto}
.tx.kr{letter-spacing:-.2px}
/* 분수 · 대분수(11-07 — 이 쪽엔 빠져 있어 5/8이 '58'로 인쇄되던 것 · 점검지 paper.css와 같은 모양) */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 1mm;line-height:1.05}.fr-t{border-bottom:1.6px solid currentColor;padding:0 1.2mm .6mm;min-width:5mm;text-align:center}.fr-b{padding:.6mm 1.2mm 0;min-width:5mm;text-align:center}
.mx{display:inline-flex;align-items:center;gap:.5mm;vertical-align:middle}
.fr .blank-s{min-width:10mm;height:calc(7.5mm * var(--k,1));margin:.6mm 0}
.ex .fr .blank-s,.key .fr .blank-s{min-width:8mm;height:6.5mm;font-size:12pt}
.foot{display:flex;justify-content:space-between;font-size:10pt;color:#7a7067;margin-top:4mm}
.key h1{font-size:19pt;margin:0 0 4mm}.key .foot{margin-top:auto}
.key section{border-left:1.2mm solid var(--c);padding:1.5mm 0 1.5mm 4mm;margin-bottom:3.5mm;break-inside:avoid}
.key h2{margin:0 0 1mm;font-size:12.5pt}
.key ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(5,1fr);gap:.6mm 3mm;font-size:11pt}
.key li b{color:var(--c);margin-right:1.5mm}
.noprint{max-width:210mm;margin:6mm auto 0;font-size:11pt;color:#5e554b}
</style>
</head>
<body>
<p class="noprint">인쇄: Ctrl+P → 여백 '없음' · 배경 그래픽 켜기. 주소 # 뒤에 갈래 · 문제 수 · 씨앗이 들어 있어 같은 주소면 같은 문제가 나와요.</p>
<div id="out"></div>
<script type="module" src="js/practice.js"></script>
</body>
</html>
