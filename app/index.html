<header class="bar"><div class="bar-in">
  <a class="logo" href="#/"><span class="mark" id="logo-m" aria-hidden="true"></span><span><b>튼튼 수 다리</b><small class="tag-k">점검 · 배울 것 · 매일 연습</small><small class="tag-t">점검 내기 · 반 표 · 보충 주기</small></span></a>

  <span class="who" id="who"></span>
</div></header>
<main id="view" tabindex="-1"><p class="card">불러오는 중…</p></main>
<noscript><p class="card">이 앱은 자바스크립트가 켜져 있어야 해요.</p></noscript>
<script type="module">
// 버전이 바뀌었으면 앱 파일을 모두 새로 받아 둔 뒤 시작(옛 파일과 새 파일이 섞이지 않게) — tools/ver.mjs
let cur = null; try { cur = localStorage.getItem('tt.ver'); } catch (e) { /* */ }
try {
  const V = await (await fetch('version.json', { cache: 'no-store' })).json();
  if (V.v !== cur) { await Promise.all(V.files.map((f) => fetch(f, { cache: 'reload' }).catch(() => null))); try { localStorage.setItem('tt.ver', V.v); } catch (e) { /* */ } }
} catch (e) { /* 버전 파일을 못 읽으면 그냥 시작 */ }
import('./js/main.js');
</script>
